# testing compose file
# includes rabbitmq, fossbilling, mysql, pub/sub
networks:
  billing_net_testing:
    driver: bridge
services:
  fossbilling:
    image: fossbilling/fossbilling:latest
    container_name: fossbilling-testing
    restart: always
    ports:
      - "${FOSSBILLING_PORT}:80"
    volumes:
      - fossbilling:/var/www/html
    networks:
      - billing_net_testing
  mysql:
    image: mysql:8.2
    container_name: billing-mysql-testing
    restart: always
    ports:
      - "${MYSQL_PORT_DOCKER}:3306"
    environment:
      MYSQL_DATABASE: fossbilling
      MYSQL_USER: fossbilling
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    networks:
      - billing_net_testing
  billing-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer.dev
    depends_on:
      - rabbitmq
      - fossbilling
      - mysql
    container_name: billing-consumer-testing
    restart: always
    networks:
      - billing_net_testing
      - attendify_net_testing
    env_file:
      - .env
  billing-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer.dev
    depends_on:
      - rabbitmq
      - fossbilling
      - mysql
    container_name: billing-producer-testing
    restart: always
    networks:
      - billing_net_testing
      - attendify_net_testing
    env_file:
      - .env
  billing-heartbeat:
    build:
      context: .
      dockerfile: Dockerfile.heartbeat.dev
    depends_on:
      - rabbitmq
      - fossbilling
      - mysql
    container_name: billing-heartbeat-testing
    restart: always
    networks:
      - billing_net_testing
      - attendify_net_testing
    env_file:
      - .env
      
volumes:
  fossbilling: