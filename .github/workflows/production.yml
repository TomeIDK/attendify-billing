name: FOSSBilling Pre-Prod Deploy & PR Check

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (skip deployment)'
        required: true
        type: boolean
        default: false
  push:
    branches:
      - release
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - release
    # Covers PRs from release → any other branch

jobs:
  ## Job 1: Deploy to Pre-Prod when release gets updated
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pre-prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Verify Docker Compose
        run: |
          if [ ! -f "docker-compose.prod.yml" ]; then
            echo "Error: docker-compose.prod.yml not found"
            exit 1
          fi
          if [ ! -f "Dockerfile.consumer.prod" ] || [ ! -f "Dockerfile.producer.prod" ]; then
            echo "Error: Required Dockerfiles not found"
            exit 1
          fi

      - name: Create Test Environment
        if: ${{ inputs.test_mode }}
        run: |
          # Create a test .env file with dummy values for testing
          cat > .env << EOF
          MYSQL_DATABASE=fossbilling
          MYSQL_USER=fossbilling
          MYSQL_PASSWORD=test_password
          MYSQL_ROOT_PASSWORD=test_root_password
          RABBITMQ_DEFAULT_USER=fossbilling
          RABBITMQ_DEFAULT_PASS=test_rabbit_pass
          EOF

      - name: Setup Production Environment
        if: ${{ !inputs.test_mode }}
        run: |
          # Create production .env file with actual secrets
          cat > .env << EOF
          MYSQL_DATABASE=fossbilling
          MYSQL_USER=fossbilling
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          RABBITMQ_DEFAULT_USER=fossbilling
          RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }}
          EOF

      - name: Create Test Docker Network
        if: ${{ inputs.test_mode }}
        run: |
          docker network create attendify_net || true

      - name: Build Docker Images
        run: |
          docker build -f Dockerfile.consumer.prod -t fossbilling-consumer:latest .
          docker build -f Dockerfile.producer.prod -t fossbilling-producer:latest .

      - name: Test Docker Compose Configuration
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env config
          echo "Docker compose configuration is valid"

      - name: Setup SSH Agent
        if: ${{ !inputs.test_mode }}
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify Server Connection
        if: ${{ !inputs.test_mode }}
        run: |
          ssh -o StrictHostKeyChecking=no student@${{ secrets.DNS_NAME }} "echo 'Connection successful'"

      - name: Deploy to Server via SSH
        if: ${{ !inputs.test_mode }}
        run: |
          # Copy .env file to server
          scp -o StrictHostKeyChecking=no .env student@${{ secrets.DNS_NAME }}:/root/billing/attendify-billing/
          
          ssh -o StrictHostKeyChecking=no student@${{ secrets.DNS_NAME }} << 'EOF'
            set -e
            cd /root/billing/attendify-billing
            git pull origin release
            docker compose -f docker-compose.prod.yml up -d --build
            sleep 10
            docker ps | grep fossbilling
          EOF

      - name: Test Mode - Skip Deployment
        if: ${{ inputs.test_mode }}
        run: |
          echo "Running in test mode - deployment steps skipped"
          echo "All build and configuration checks passed"

      - name: Cleanup Test Environment
        if: ${{ inputs.test_mode }}
        run: |
          docker network rm attendify_net || true
          rm -f .env

      - name: Cleanup Production Environment
        if: ${{ !inputs.test_mode }}
        run: |
          rm -f .env

      - name: Verify Deployment
        if: ${{ !inputs.test_mode }}
        run: |
          ssh -o StrictHostKeyChecking=no student@${{ secrets.DNS_NAME }} << 'EOF'
            set -e
            if ! docker ps | grep -q "fossbilling"; then
              echo "Error: Services not running after deployment"
              exit 1
            fi
          EOF

  ## Job 2: Run checks when a PR is created FROM release → any other branch
  Pull-requests:
    if: github.event_name == 'pull_request' && (github.base.ref == 'release' || github.head.ref == 'release')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create Test Environment
        run: |
          cat > .env << EOF
          MYSQL_DATABASE=fossbilling
          MYSQL_USER=fossbilling
          MYSQL_PASSWORD=test_password
          MYSQL_ROOT_PASSWORD=test_root_password
          RABBITMQ_DEFAULT_USER=fossbilling
          RABBITMQ_DEFAULT_PASS=test_rabbit_pass
          EOF

      - name: Create Test Docker Network
        run: |
          docker network create attendify_net || true

      - name: Verify Required Files
        run: |
          if [ ! -f "docker-compose.prod.yml" ]; then
            echo "Error: docker-compose.prod.yml not found"
            exit 1
          fi
          if [ ! -f "Dockerfile.consumer.prod" ] || [ ! -f "Dockerfile.producer.prod" ]; then
            echo "Error: Required Dockerfiles not found"
            exit 1
          fi

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env config

      - name: Cleanup Test Environment
        run: |
          docker network rm attendify_net || true
          rm -f .env

      - name: Run basic validation checks
        run: |
          echo "Validating PR from 'release' branch..."
          # Place your real tests, linters, Docker dry-run, etc. here
          echo "Checks passed for PR from release"
