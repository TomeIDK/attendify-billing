# dev compose file
# includes rabbitmq, fossbilling, mysql, pub/sub
networks:
  billing_net:
    driver: bridge
  attendify_net:
    external: true
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: some-rabbit
    restart: always
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_USER: attendify
      RABBITMQ_DEFAULT_VHOST: attendify
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
      - "${RABBITMQ_PORT}:5672"
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    networks:
      - attendify_net
  fossbilling:
    image: fossbilling/fossbilling:latest
    restart: always
    ports:
      - "${FOSSBILLING_PORT}:80"
    volumes:
      - fossbilling:/var/www/html
    networks:
      - billing_net
  mysql:
    image: mysql:8.2
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_DATABASE: fossbilling
      MYSQL_USER: fossbilling
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    networks:
      - billing_net
  billing-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer.dev
    depends_on:
      - rabbitmq
      - fossbilling
      - mysql
    restart: always
    volumes:
      - ./consumers:/app/consumers
      - ./parser.php:/app/parser.php
    networks:
      - attendify_net
      - billing_net
    env_file:
      - .env
  billing-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer.dev
    depends_on:
      - rabbitmq
      - fossbilling
      - mysql
    restart: always
    volumes:
      - ./producers:/app/producers
      - ./parser.php:/app/parser.php
    networks:
      - attendify_net
      - billing_net
    env_file:
      - .env
      
volumes:
  fossbilling: