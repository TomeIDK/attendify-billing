# COMPOSE FILE FOR A LOCAL RABBITMQ INSTANCE
# THIS FILE SHOULD NOT BE USED IN PRODUCTION
include:
  - docker-compose.billing.yml
networks:
  attendify_net:
    external: true
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: some-rabbit
    restart: always
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_USER: attendify
      RABBITMQ_DEFAULT_VHOST: attendify
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    networks:
      - attendify_net